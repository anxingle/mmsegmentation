<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像分割服务 - Image Segmentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2196F3, #21CBF3);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .upload-section {
            padding: 40px;
            background: #f8f9fa;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .upload-area:hover {
            border-color: #2196F3;
            background: #f0f8ff;
        }

        .upload-area.dragover {
            border-color: #21CBF3;
            background: #e3f2fd;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #ddd;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #2196F3, #21CBF3);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.3);
        }

        .results-section {
            padding: 40px;
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
        }

        .result-header {
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            font-weight: bold;
            text-align: center;
        }

        .result-header.original {
            background: linear-gradient(135deg, #FF9800, #F57C00);
        }

        .result-header.mask {
            background: linear-gradient(135deg, #9C27B0, #7B1FA2);
        }

        .result-header.overlay {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .result-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            padding: 20px;
            background: #f5f5f5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
            display: none;
            border-left: 5px solid #c62828;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
            display: none;
            border-left: 5px solid #4CAF50;
        }

        .file-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #2196F3;
        }

        .tongue-ratio-card {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            border-radius: 20px;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 15px 30px rgba(255, 107, 107, 0.2);
            text-align: center;
            color: white;
        }

        .ratio-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .ratio-icon {
            font-size: 2em;
        }

        .ratio-header h3 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 600;
        }

        .ratio-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ratio-number {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .ratio-label {
            font-size: 1.1em;
            margin-bottom: 15px;
            opacity: 0.95;
            font-weight: 500;
        }

        .ratio-description {
            font-size: 0.95em;
            opacity: 0.85;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .upload-area {
                padding: 40px 15px;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .tongue-ratio-card {
                padding: 20px;
                margin: 10px 0;
            }

            .ratio-number {
                font-size: 3em;
            }

            .ratio-header h3 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 图像分割服务</h1>
            <p>使用深度学习模型进行精确的图像语义分割</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">
                    拖拽图片到这里或点击选择文件<br>
                    <small>支持 PNG, JPG, JPEG, BMP, TIFF 格式</small>
                </div>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    选择图片
                </button>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
            </div>

            <div class="file-info" id="fileInfo" style="display: none;">
                <strong>已选择文件:</strong> <span id="fileName"></span><br>
                <strong>文件大小:</strong> <span id="fileSize"></span>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在处理图片，请稍候...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="results-section" id="resultsSection">
            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">分割结果</h2>

            <!-- 舌体占比信息 -->
            <div class="tongue-ratio-card">
                <div class="ratio-header">
                    <span class="ratio-icon">👅</span>
                    <h3>舌体占比分析</h3>
                </div>
                <div class="ratio-content">
                    <div class="ratio-number" id="tongueRatio">--</div>
                    <div class="ratio-label">舌体面积占图片比例</div>
                    <div class="ratio-description" id="ratioDescription">请上传图片进行分析</div>
                </div>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <div class="result-header original">原始图片</div>
                    <img id="originalImage" class="result-image" alt="原始图片">
                </div>
                <div class="result-card">
                    <div class="result-header mask">分割掩码</div>
                    <img id="maskImage" class="result-image" alt="分割掩码">
                </div>
                <div class="result-card">
                    <div class="result-header overlay">叠加结果</div>
                    <img id="overlayImage" class="result-image" alt="叠加结果">
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const resultsSection = document.getElementById('resultsSection');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const tongueRatio = document.getElementById('tongueRatio');
        const ratioDescription = document.getElementById('ratioDescription');

        // 舌体占比描述生成
        function getTongueRatioDescription(ratio) {
            if (ratio === '--') {
                return '请上传图片进行分析';
            } else if (ratio < 5) {
                return '舌体占比较小，可能拍摄距离较远';
            } else if (ratio < 15) {
                return '舌体占比适中，图像质量良好';
            } else if (ratio < 25) {
                return '舌体占比较大，细节清晰可见';
            } else {
                return '舌体占比过大，建议调整拍摄距离';
            }
        }

        // 拖拽上传功能
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // 文件选择功能
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 处理文件
        function handleFile(file) {
            // 检查文件类型
            const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/bmp', 'image/tiff'];
            if (!allowedTypes.includes(file.type)) {
                showError('请选择有效的图片文件 (PNG, JPG, JPEG, BMP, TIFF)');
                return;
            }

            // 检查文件大小 (16MB)
            if (file.size > 16 * 1024 * 1024) {
                showError('文件大小不能超过 16MB');
                return;
            }

            // 显示文件信息
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.style.display = 'block';

            // 上传文件
            uploadFile(file);
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 上传文件
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            // 显示加载状态
            loading.style.display = 'block';
            resultsSection.style.display = 'none';
            hideMessages();

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    // 显示结果
                    document.getElementById('originalImage').src = result.original_image;
                    document.getElementById('maskImage').src = result.mask_image;
                    document.getElementById('overlayImage').src = result.overlay_image;

                    // 显示舌体占比
                    tongueRatio.textContent = result.tongue_ratio + '%';
                    ratioDescription.textContent = getTongueRatioDescription(result.tongue_ratio);

                    resultsSection.style.display = 'block';
                    showSuccess('图片处理完成！');
                } else {
                    showError(result.error || '处理失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // 显示错误消息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        // 显示成功消息
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        // 隐藏所有消息
        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 检查服务器健康状态
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    if (!data.model_loaded) {
                        showError('模型未加载，请检查服务器配置');
                    }
                })
                .catch(error => {
                    console.error('健康检查失败:', error);
                });
        });
    </script>
</body>
</html>
